<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E6F1F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D1A20" media="(prefers-color-scheme: dark)">
  <title>Hydrippo</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app" id="app" hidden>
    <header class="topbar">
      <div class="wordmark" aria-label="Hydrippo">Hydr<b>ippo</b></div>
      <div class="daylabel" id="daylabel"></div>
    </header>
    <main class="screen" id="screen" tabindex="-1"></main>
    <nav class="tabbar" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" data-tab="today" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c3.5 4.2 6 7.6 6 10.6A6 6 0 0 1 6 13.6C6 10.6 8.5 7.2 12 3Z"/></svg>
        Today
      </button>
      <button class="tab" role="tab" data-tab="history" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V11M10 20V6M15 20v-8M20 20V9"/></svg>
        History
      </button>
      <button class="tab" role="tab" data-tab="settings" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        Settings
      </button>
    </nav>
  </div>
  <div class="onboard" id="onboard" hidden></div>
  <div id="sheet-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="banner" id="banner" role="alert" hidden></div>

  <script src="js/core.js"></script>
  <script src="js/zip3.js"></script>
  <script src="js/store.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/art.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
